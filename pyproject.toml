[project]
name = "hydrofragments"
version = "0.1.0"
description = "HydroFragments: surface-water patch dynamics metrics for intermittent rivers"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Thiaggo de Castro Tayer" }]
keywords = ["hydrology", "surface-water", "remote-sensing", "intermittent-rivers"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "dask[complete]>=2024.5",
  "dask-image>=2024.5",
  "dask-regionprops>=0.3",
  "geopandas>=0.14",
  "hydroseason==0.1.0",
  "igraph>=0.11",
  "numpy>=1.26",
  "odc-algo>=0.2",
  "odc-geo>=0.4",
  "odc-stac>=0.3",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "pyogrio>=0.7",
  "pyproj>=3.6",
  "pystac-client>=0.7",
  "rasterio>=1.3",
  "rioxarray>=0.15",
  "scipy>=1.11",
  "scikit-image>=0.22",
  "shapely>=2.0",
  "tqdm>=4.66",
  "xarray>=2024.5",
  "zarr>=2.18,<3"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-timeout>=2.3"
]
cuda = [
  "cupy-cuda12x>=13.0"
]
cuda11 = [
  "cupy-cuda11x>=13.0"
]
benchmark-dci = [
  "geopandas>=0.14",
  "rasterio>=1.3",
  "scikit-image>=0.22"
]
netcdf = [
  "h5netcdf>=1.4"
]

[project.urls]
Homepage = "https://github.com/tayerthiaggo/HydroFragments"
Repository = "https://github.com/tayerthiaggo/HydroFragments"
Documentation = "https://github.com/tayerthiaggo/HydroFragments/tree/main/docs"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["hydrofragments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: full pipeline integration tests (deselect with '-m not slow')",
  "hardware: optional GPU/CUDA hardware smoke tests"
]
